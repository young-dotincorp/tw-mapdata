# 매주 한 번: 한국 OSM 원본 → 보행·접근성 요소만 골라 격자 파일로 → GitHub Pages 에 공개(무료)
# 실패하면 배포 단계가 돌지 않아 «지난주 데이터»가 그대로 남는다(안전).
name: build-mapdata

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 일요일 18:17 UTC = 월요일 03:17 KST
  workflow_dispatch: {}     # Actions 탭에서 «Run workflow» 로 바로 실행

permissions:
  contents: write   # 한 달에 한 번 빈 커밋(아래 keepalive) — 공개 저장소는 60일 활동이 없으면 예약 실행이 멈춘다
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --quiet "osmium>=4,<5"
          python -c "import osmium, sys; print('pyosmium OK', sys.version)"

      - name: 한국 OSM 원본 받기 (Geofabrik, 주 1회)
        run: |
          curl -fsSL --retry 3 --retry-delay 30 \
            -A "TactileWorlds-mapdata/1.0 (+https://tactileworlds.com)" \
            -o kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          ls -lh kr.osm.pbf

      - name: 보행·접근성 요소만 거르기
        run: |
          osmium tags-filter kr.osm.pbf \
            w/highway=footway,path,pedestrian,steps,living_street,crossing \
            w/footway=crossing \
            nw/tactile_paving \
            n/highway=crossing,bus_stop \
            n/public_transport=platform \
            n/entrance \
            w/highway=primary,secondary,tertiary,residential,unclassified,service,trunk,road \
            -o filtered.osm.pbf --overwrite
          ls -lh filtered.osm.pbf

      - name: 격자 파일 만들기
        run: |
          mkdir -p site
          cp -r public/. site/
          osmium fileinfo -e filtered.osm.pbf | grep -E "Number of (nodes|ways)" || true
          /usr/bin/time -v python build_cells.py filtered.osm.pbf site --max-mb 900 2> time.log || { tail -25 time.log; exit 1; }
          grep -E "Maximum resident|Elapsed" time.log
          touch site/.nojekyll
          du -sh site

      # 【1,610】 검색 2단계: 이름 있는 곳(역·지하철 출구·학교·복지관·병원·관공서·정류장·공원·상점)만 골라
      #   0.1도 칸별 지명 색인 → 앱이 오타·초성·부분 이름으로 찾는다. 실패해도 지도(격자 파일)는 그대로 배포된다.
      - name: 지명 색인 만들기(검색 2단계)
        continue-on-error: true
        run: |
          osmium tags-filter kr.osm.pbf \
            n/railway=station,halt,subway_entrance \
            nw/public_transport=station \
            n/highway=bus_stop \
            n/public_transport=platform \
            nw/amenity=social_facility,community_centre,school,university,college,library,kindergarten,hospital,clinic,pharmacy,doctors,townhall,police,post_office,courthouse,fire_station,bank,marketplace \
            nw/office=government \
            nw/leisure=park \
            nw/tourism=attraction,museum,gallery,viewpoint \
            nw/shop=convenience,supermarket,department_store,mall \
            -o places.osm.pbf --overwrite
          ls -lh places.osm.pbf
          python build_places.py places.osm.pbf site --max-mb 150
          du -sh site/v1/names

      - name: 예약 실행 멈춤 방지(매달 첫 주 빈 커밋)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then
            git config user.name "tw-mapdata-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%Y-%m)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
